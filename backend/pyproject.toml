[project]
name = "coderag"
version = "0.1.0"
description = "RAG-based programming learning knowledge base and Q&A system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "asyncmy>=0.2.9",
    "pymysql>=1.2.0",
    "alembic>=1.14.1",
    "redis>=4.6.0,<6",
    "kombu>=5.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "beautifulsoup4>=4.13.0",
    "pypdf>=5.3.0",
    "markdown>=3.7",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.4.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "celery>=5.4.0",
    "flower>=2.0.0",
    "pygments>=2.19.0",
    "tree-sitter>=0.24.0",
    "gitpython>=3.1.44",
    "pandas>=2.2.0",
    "prometheus-client>=0.21.0",
    "tenacity>=9.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
